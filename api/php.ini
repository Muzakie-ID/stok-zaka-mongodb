; Konfigurasi tambahan untuk runtime vercel-php (digabung ke php.ini runtime saat build).
; Runtime vercel-php TIDAK membundel ekstensi mongodb (diverifikasi via /diag),
; jadi kita kirim .so buatan Remi (php85, API 20250925 NTS - cocok dengan PHP 8.5
; runtime) di api/ext/. Path HARUS absolut: file user di Lambda ada di /var/task/user/.
; Dependensi (libsasl2/libsnappy/libutf8proc/libzstd) tidak ada di image runtime dan
; LD_LIBRARY_PATH tidak bisa dipakai (reserved AWS Lambda - env var project tidak
; pernah sampai ke runtime). Solusinya: mongodb.so di repo ini SUDAH dipatch
; DT_RPATH=$ORIGIN (patch lokal via skrip Python, lihat riwayat commit), sehingga
; dynamic loader menemukan dependensi di folder yang sama saat startup PHP.
; api/bootstrap-mongo.php tetap ada sebagai fallback loader runtime (FFI preload +
; dl()) untuk lingkungan yang masih menyediakan dl().
extension=/var/task/user/api/ext/mongodb.so
