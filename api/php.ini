; Konfigurasi tambahan untuk runtime vercel-php (digabung ke php.ini runtime saat build).
; Runtime 0.8.0/0.9.0 kadang tidak me-load ekstensi mongodb secara default;
; baris ini memaksa load dari direktori modul runtime. Jika file .so tidak ada,
; PHP hanya mencatat warning startup dan tetap berjalan.
extension=mongodb.so
