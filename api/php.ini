; Konfigurasi tambahan untuk runtime vercel-php (digabung ke php.ini runtime saat build).
; Runtime vercel-php TIDAK membundel ekstensi mongodb (diverifikasi via /diag 2026-10-13),
; jadi kita kirim .so buatan Remi (php85, API 20250925 NTS - cocok dengan PHP 8.5 runtime)
; di api/ext/. Path HARUS absolut: file user di Lambda ada di /var/task/user/.
; Dependensi (libsasl2/libsnappy/libutf8proc/libzstd) dicari loader via
; LD_LIBRARY_PATH=/var/task/user/api/ext (diset sebagai env var project Vercel).
; Jika file tidak ada / gagal load, PHP hanya mencatat warning startup dan tetap berjalan.
extension=/var/task/user/api/ext/mongodb.so
